      k));'
  metadata:
    case_id: INC-005
    category: conflict
- description: INC-006 / ordinary
  vars:
    source_text: 'INC-1046 affects inventory-api. Severity is critical. Customer impact:
      17 orders delayed.'
  assert:
  - type: javascript
    value: 'const actual = JSON.parse(output); const expected = {"incident_id": "INC-1046",
      "service": "inventory-api", "severity": "critical", "customer_impact": "17 orders
