name: Fixture tests and dashboard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed dashboard from main
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './SchemaStress[dev]'
      - run: python -m pytest -q
        working-directory: SchemaStress
      - name: Reproduce fixture reports and provider parity
        working-directory: SchemaStress
        run: |
          schemastress demo --out "$RUNNER_TEMP/demo"
          diff -ru reports/demo "$RUNNER_TEMP/demo"
          python scripts/check_parity.py > "$RUNNER_TEMP/parity.json"
          diff -u reports/comparison/deterministic-comparison.json "$RUNNER_TEMP/parity.json"
      - run: python scripts/build_site.py --check
      - run: node --check site/assets/app.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
        with:
          path: site
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
